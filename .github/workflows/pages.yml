name: Deploy to Pages

# Publishing follows CI rather than the push itself, so a red build never
# reaches the live site. workflow_run fires once CI concludes; the conclusion is
# then checked below, because "completed" includes failure and cancellation.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed to look up whether CI passed for the commit being published.
  actions: read

# Never cancel a half-finished deployment; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # A manual run is a convenience, not an exemption: the guard step below
    # requires the commit to have its own green CI run before anything ships.
    env:
      TZ: UTC
      # Switches next.config.ts to a static export served from /<repo>.
      GITHUB_PAGES: "true"

    steps:
      # A workflow_run event starts from the default branch, so the commit CI
      # actually validated has to be named explicitly — otherwise a later push
      # could be published on the strength of an earlier commit's green run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Require a passing CI run for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          runs="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=completed"
          conclusion="$(gh api "${runs}" --jq '[.workflow_runs[].conclusion] | first // "none"')"
          echo "CI conclusion for ${sha}: ${conclusion}"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::Refusing to publish ${sha}: CI conclusion is '${conclusion}'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Keep Pages from running Jekyll over _next
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
