name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Pinned so a run cannot pass or fail because of the runner's own clock.
    env:
      TZ: UTC
    permissions:
      # The badge step writes back to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json

      - name: Build
        run: npm run build

      # A count maintained by hand is a count that goes stale, so it is taken
      # from the run that just happened. Pull requests are excluded: a CI run
      # must not rewrite the branch it is only meant to be checking.
      - name: Update the test-count badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          count="$(node -p "require('./test-results.json').numPassedTests")"
          # Capture only the count. Matching every run of digits would also pick
          # up the 20 in the %20 that encodes the space.
          current="$(sed -nE 's/.*tests-([0-9]+)%20passing.*/\1/p' README.md | head -1)"

          if [ "${count}" = "${current}" ]; then
            echo "Badge already reads ${count} passing; nothing to do."
            exit 0
          fi

          echo "Updating badge: ${current:-none} -> ${count}"
          sed -i -E "s/tests-[0-9]+%20passing/tests-${count}%20passing/" README.md

          # Belt and braces: never let an empty diff fail the build.
          if git diff --quiet -- README.md; then
            echo "README already up to date."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          # [skip ci] stops this commit starting a run that would find nothing
          # left to change.
          git commit -m "Update the test-count badge to ${count} [skip ci]"

          # Another push may have landed while the suite was running.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main (attempt ${attempt})."
            git pull --rebase --autostash origin main
          done
          exit 1

  # Accessibility and layout are checked against the built export, in both
  # themes and at phone width, so a contrast or overflow regression fails the
  # build rather than waiting for someone to notice.
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: UTC
      GITHUB_PAGES: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        timeout-minutes: 6
        run: npx --yes playwright install chromium

      - name: Build static export
        run: npm run build

      - name: Audit
        run: npm run audit
