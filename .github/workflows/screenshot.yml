name: Screenshot

# Runs after CI passes, for the same reason Pages does: a screenshot of a build
# that does not work is worse than a stale one.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # A stuck step should fail the run rather than occupy a runner for an hour.
    timeout-minutes: 12
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      TZ: UTC
      # Builds the static export, which is what the script serves and shoots.
      GITHUB_PAGES: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The browser download is ~150 MB, so it is worth keeping between runs.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        timeout-minutes: 6
        # No --with-deps: that shells out to apt, which hung for an hour on a
        # cold cache, and the ubuntu-latest image already carries the libraries
        # Chromium needs. --yes stops npx ever pausing for confirmation.
        run: npx --yes playwright install chromium

      - name: Build static export
        run: npm run build

      - name: Capture
        run: npm run screenshot

      - name: Commit the screenshot if it changed
        run: |
          if git diff --quiet -- docs/screenshot.png; then
            echo "The interface is unchanged; screenshot left alone."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshot.png
          # [skip ci] so a screenshot does not trigger the run that regenerates it.
          git commit -m "Update the screenshot [skip ci]"

          # The checkout is a detached HEAD at the commit CI validated, so the
          # branch has to be named on the push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main (attempt ${attempt})."
            git fetch origin main
            git rebase origin/main
          done
          exit 1
